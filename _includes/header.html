<style>
    /* Apple-style Glass Blur Effect */
    .header-glass {
        background-color: rgba(18, 18, 18, 0.65);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    
    /* Menyembunyikan Widget Bawaan Google Translate yang Kaku */
    #google_translate_element { display: none !important; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0px !important; } /* Mencegah bug layar turun ke bawah */
</style>

<!-- Script Inti Google Translate (Berjalan di latar belakang) -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'id', 
            includedLanguages: 'en,ja,zh-CN,ko,nl', 
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Mengubah posisi menjadi fixed agar mengambang di atas seperti tombol checkout -->
<header class="header-glass fixed top-0 left-0 w-full z-[100] transition-all duration-300">
    <div class="max-w-7xl mx-auto py-3 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        
        <!-- Company Logo (Left Side) -->
        <a href="/" class="flex items-center space-x-3 group" title="Kembali ke Halaman Utama">
            <img src="/images/logo/2024/2024 logo n name white - alphacast.id.png" alt="alphacast.id Logo" class="h-16 w-50 rounded-full object-cover transition-transform duration-300 group-hover:scale-105">
        </a>

        <!-- Custom UI Language Selector (Right Side) -->
        <div class="relative inline-block text-left" id="lang-menu-container">
            <!-- Tombol Utama Dropdown -->
            <button onclick="toggleLangMenu()" class="flex items-center gap-2 bg-[#1e1e1e]/80 border border-gray-700 hover:border-[#2196F3] text-white px-3 py-2 rounded-lg text-sm transition-all shadow-lg backdrop-blur-sm cursor-pointer">
                <span id="current-lang-flag" class="text-base">🇮🇩</span>
                <span class="hidden sm:inline font-medium tracking-wide" id="current-lang-text">ID</span>
                <i class="fa-solid fa-chevron-down text-xs ml-1 text-gray-400"></i>
            </button>
            
            <!-- Isi Menu Dropdown -->
            <div id="lang-dropdown" class="absolute right-0 mt-2 w-44 rounded-xl shadow-2xl bg-[#1e1e1e] border border-gray-700 hidden flex-col overflow-hidden transition-all z-[101]">
                
                <!-- Opsi Bahasa Indonesia (Reset ke awal) -->
                <button onclick="changeLang('', '🇮🇩', 'ID')" class="flex items-center gap-3 px-4 py-3 text-sm text-white hover:bg-[#2196F3] transition-colors w-full text-left font-medium">
                    <span class="text-xl">🇮🇩</span> Indonesia
                </button>
                
                <!-- Opsi Bahasa Lainnya -->
                <button onclick="changeLang('en', '🇬🇧', 'EN')" class="flex items-center gap-3 px-4 py-3 text-sm text-gray-300 hover:bg-[#2196F3] hover:text-white transition-colors w-full text-left border-t border-gray-800">
                    <span class="text-xl">🇬🇧</span> English
                </button>
                
                <button onclick="changeLang('ja', '🇯🇵', 'JA')" class="flex items-center gap-3 px-4 py-3 text-sm text-gray-300 hover:bg-[#2196F3] hover:text-white transition-colors w-full text-left border-t border-gray-800">
                    <span class="text-xl">🇯🇵</span> 日本語 (Japan)
                </button>
                
                <button onclick="changeLang('ko', '🇰🇷', 'KO')" class="flex items-center gap-3 px-4 py-3 text-sm text-gray-300 hover:bg-[#2196F3] hover:text-white transition-colors w-full text-left border-t border-gray-800">
                    <span class="text-xl">🇰🇷</span> 한국어 (Korea)
                </button>
                
                <button onclick="changeLang('zh-CN', '🇨🇳', 'ZH')" class="flex items-center gap-3 px-4 py-3 text-sm text-gray-300 hover:bg-[#2196F3] hover:text-white transition-colors w-full text-left border-t border-gray-800">
                    <span class="text-xl">🇨🇳</span> 中文 (China)
                </button>
                
                <button onclick="changeLang('nl', '🇳🇱', 'NL')" class="flex items-center gap-3 px-4 py-3 text-sm text-gray-300 hover:bg-[#2196F3] hover:text-white transition-colors w-full text-left border-t border-gray-800">
                    <span class="text-xl">🇳🇱</span> Nederlands
                </button>
            </div>
        </div>

        <!-- Wadah Rahasia Google Translate -->
        <div id="google_translate_element"></div>

    </div>
</header>

<!-- Script Logika Custom Dropdown -->
<script>
    function toggleLangMenu() {
        const dropdown = document.getElementById('lang-dropdown');
        dropdown.classList.toggle('hidden');
        dropdown.classList.toggle('flex');
    }

    // Menutup menu otomatis jika user mengklik area lain di luar kotak menu
    document.addEventListener('click', function(event) {
        const container = document.getElementById('lang-menu-container');
        if (container && !container.contains(event.target)) {
            const dropdown = document.getElementById('lang-dropdown');
            if(dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
                dropdown.classList.remove('flex');
            }
        }
    });

    // Fungsi sakti untuk mengendalikan Google Translate
    function changeLang(langCode, flag, text) {
        // 1. Ubah ikon bendera dan teks di tombol header
        const flagElem = document.getElementById('current-lang-flag');
        const textElem = document.getElementById('current-lang-text');
        if (flagElem) flagElem.innerText = flag;
        if (textElem) textElem.innerText = text;
        
        // 2. Tutup dropdown setelah dipilih
        toggleLangMenu();

        // 3. Memicu pergantian bahasa di kotak Google Translate yang disembunyikan
        const selectField = document.querySelector('.goog-te-combo');
        if (selectField) {
            selectField.value = langCode; 
            selectField.dispatchEvent(new Event('change'));
        } else {
            // Jika script Google belum selesai termuat karena internet lambat, coba lagi 0.5 detik
            setTimeout(() => changeLang(langCode, flag, text), 500);
        }
    }
</script>
